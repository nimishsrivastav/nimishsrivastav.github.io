+

+
+      function App() {
+        const [profile, setProfile] = React.useState(null);
+
+        React.useEffect(() => {
+          async function loadProfile() {
+            const query = `
+              {
+                profile {
+                  name
+                  title
+                  summary
+                  location
+                  metrics { label value }
+                  skills
+                  focusAreas
+                  projects { name description stack highlight }
+                  experiences { role company summary period }

+                }
+              }

+          }
+          loadProfile();
+        }, []);
+
+        if (!profile) {
